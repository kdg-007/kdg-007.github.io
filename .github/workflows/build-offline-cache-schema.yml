name: Compile cache schema upgrade
on:
  push:
    branches: [fix/offline-cache-schema]
    paths: ['ops/ui/live-modules/onedrive-connection.js', '.github/workflows/build-offline-cache-schema.yml']
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build pinned owner modules
        run: |
          printf '{"type":"module","private":true}\n' > package.json
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund esbuild@0.28.2
          node ops/ui/build-live-stability.mjs
      - name: Preserve compiled outputs and remove this one-time builder
        run: |
          git config user.name 'KeepIt module builder'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/keepit-onedrive-connect-*.js assets/library-app-*.js ops/ui/LIVE_STABILITY_MODULES.json partners/connected/index.html partners/connected/owner-release.json partners/connected/liveit-calendar-release.json
          git rm .github/workflows/build-offline-cache-schema.yml
          git commit -m 'Compile protected version-2 originals cache'
          git push origin HEAD:fix/offline-cache-schema
