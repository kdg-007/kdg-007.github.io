name: KeepIt Mac catalog null defensive readback
on:
  push:
    branches: [fix/keepit-mac-catalog-null-diagnostics-20261118]
    paths:
      - ops/ui/live-modules/onedrive-connection.js
      - ops/ui/build-live-stability.mjs
      - partners/connected/onedrive-recovery.test.mjs
      - partners/travelit/thinkit/afda98f5ced9406d0fe5/js/app-fast.js
      - partners/travelit/thinkit/afda98f5ced9406d0fe5/js/app.js
      - .github/workflows/keepit-mac-catalog-build.yml
permissions:
  contents: write
concurrency:
  group: keepit-mac-catalog-null-assets
  cancel-in-progress: false
jobs:
  compile:
    if: github.ref == 'refs/heads/fix/keepit-mac-catalog-null-diagnostics-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned release compiler
        run: |
          printf '{"type":"module","private":true}\n' > package.json
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund esbuild@0.28.2
      - name: Check transport regression without real user access
        run: node --test partners/connected/onedrive-recovery.test.mjs
      - name: Rebuild committed TravelIt bundle from checked-in source
        run: |
          npx --no-install esbuild partners/travelit/thinkit/afda98f5ced9406d0fe5/js/app.js --bundle --format=esm --platform=browser --target=es2020 --minify '--external:./excel-preview.js*' --outfile=partners/travelit/thinkit/afda98f5ced9406d0fe5/js/app-fast.js
      - name: Build content-addressed assets and signed-off release manifest
        run: node ops/ui/build-live-stability.mjs
      - name: Verify pinned OneDrive transfer hosts, URL validation and browser CSP
        run: node ops/ui/transfer-host-policy.test.mjs
      - name: Confirm that a second build is byte-identical
        run: |
          cp partners/travelit/thinkit/afda98f5ced9406d0fe5/js/app-fast.js /tmp/travelit-rebuilt-first.js
          npx --no-install esbuild partners/travelit/thinkit/afda98f5ced9406d0fe5/js/app.js --bundle --format=esm --platform=browser --target=es2020 --minify '--external:./excel-preview.js*' --outfile=partners/travelit/thinkit/afda98f5ced9406d0fe5/js/app-fast.js
          cmp /tmp/travelit-rebuilt-first.js partners/travelit/thinkit/afda98f5ced9406d0fe5/js/app-fast.js
          node ops/ui/build-live-stability.mjs
          test -f partners/connected/owner-release.json
          git diff --check
      - name: Commit only compiled owner source artifacts to draft branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/keepit-mac-catalog-null-diagnostics-20261118'
          git add assets/keepit-auth-live-*.js assets/keepit-onedrive-connect-*.js assets/keepit-transfer-hosts-*.js assets/keepit-graph-provider-*.js assets/keepit-note-ui-*.js assets/keepit-note-link-*.js assets/library-app-*.js partners/connected/index.html partners/connected/owner-release.json ops/ui/LIVE_STABILITY_MODULES.json partners/travelit/thinkit/afda98f5ced9406d0fe5/js/app-fast.js
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Compile Mac catalog null-protected OneDrive release candidate'
            git push origin HEAD:refs/heads/fix/keepit-mac-catalog-null-diagnostics-20261118
          fi
