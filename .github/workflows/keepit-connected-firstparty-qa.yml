name: KeepIt connected first-party notes QA
on:
  pull_request:
    branches: [main]
    paths:
      - "partners/connected/**"
      - "assets/library-app-connected-w18e.js"
      - ".github/workflows/keepit-connected-firstparty-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify native owner, save/reopen and connected app hosts
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact KeepIt bundle provenance and only permitted routing change
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const get=p=>readFileSync(p,'utf8');
          const root=get('index.html'),connected=get('partners/connected/index.html');
          const native=get('assets/library-app-TEDOLCCE.js');
          const patched=get('assets/library-app-connected-w18e.js');
          const a='<script type="module" src="/assets/library-app-TEDOLCCE.js"></script>';
          const b='<script type="module" src="/assets/library-app-connected-w18e.js"></script>';
          const from='h.src="/partners/liveit/thinkit/1a26c53e24e1b903260b/index.html"';
          const to='h.src="/partners/liveit/thinkit/c15396ee7cd1cba9b5e5/index.html"';
          assert.equal(root.split(a).length,2);
          assert.equal(native.split(from).length,2);
          assert.equal(connected,root.replace(a,b));
          assert.equal(patched,native.replace(from,to));
          for(const id of ['liveit','travelit','thinkit'])assert.ok(patched.includes(id));
          const status=JSON.parse(get('partners/connected/status.json'));
          assert.equal(status.oneDriveReadbackVerified,false);
          assert.equal(status.interAppOriginalDataMigration,'none');
          console.log('KEEPIT_CONNECTED_PINNED_WRITER_UNCHANGED_PASS');
          JS
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runtime in disposable runner
        shell: bash
        run: |
          printf '{"type":"module","private":true}\n' > package.json
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Exercise canonical KeepIt native-note create, save and reopen
        shell: bash
        timeout-minutes: 9
        env:
          CI: "true"
        run: node partners/connected/first-party-native-notes.test.mjs
