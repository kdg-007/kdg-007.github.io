name: KeepIt connected first-party notes QA
on:
  pull_request:
    branches: [main]
    paths:
      - "partners/connected/**"
      - "keepit-responsive-qa.js"
      - "ops/ui/keepit-responsive-qa.js"
      - ".github/workflows/keepit-pages.yml"
      - "partners/design/**"
      - "partners/liveit/thinkit/c15396ee7cd1cba9b5e5/index.html"
      - "partners/liveit/thinkit/connected-w18e-c15396/index.html"
      - "partners/travelit/thinkit/afda98f5ced9406d0fe5/**"
      - "thinkit/index.html"
      - "thinkit/assets/**"
      - "thinkit/36f8901ec722db162bcf/**"
      - "assets/library-app-connected-w18e.js"
      - ".github/workflows/keepit-connected-firstparty-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify native owner, save/reopen and connected app hosts
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact KeepIt bundle provenance and permitted connected workspace changes
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,existsSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          const get=p=>readFileSync(p,'utf8');
          const actualRoot=get('index.html'),root=existsSync('ops/ui/keepit-root-rollback.txt')?get('ops/ui/keepit-root-rollback.txt'):actualRoot,connected=get('partners/connected/index.html');
          const native=get('assets/library-app-TEDOLCCE.js');
          const patched=get('assets/library-app-connected-w18e.js');
          const a='<script type="module" src="/assets/library-app-TEDOLCCE.js"></script>';
          const b='<script type="module" src="/assets/library-app-connected-w18e.js?v=workspace-4"></script>';
          const from='h.src="/partners/liveit/thinkit/1a26c53e24e1b903260b/index.html"';
          const to='h.src="/partners/liveit/thinkit/connected-w18e-c15396/index.html?v=workspace-2"';
          assert.equal(root.split(a).length,2);
          assert.equal(native.split(from).length,2);
          const navigationCSS='<link rel="stylesheet" href="/partners/connected/connected-nav.css?v=workspace-2">';
          const navigationJS='<script src="/partners/connected/connected-nav.js?v=workspace-2" defer></script>';
          const startupJS='<script src="/partners/connected/connected-boot.js?v=workspace-4" defer></script>';
          const installChanges=[
            ['<meta name="theme-color" content="#FFFFFF">','<meta name="theme-color" content="#142331">'],
            ['<meta name="description" content="Keep anything. Find everything.">',
             '<meta name="description" content="LiveIt daily dashboard, tasks and journal. Connected notes use KeepIt.">'],
            ['<link rel="manifest" href="/manifest.webmanifest">',
             '<link rel="manifest" href="/partners/connected/liveit.webmanifest">'],
            ['<link rel="icon" href="/icon.svg" type="image/svg+xml">',
             '<link rel="icon" href="/partners/liveit/thinkit/connected-w18e-c15396/assets/icon-192.png" type="image/png">'],
            ['<link rel="apple-touch-icon" href="/apple-touch-icon.png">',
             '<link rel="apple-touch-icon" href="/partners/liveit/thinkit/connected-w18e-c15396/assets/apple-touch-icon.png">'],
            ['<meta name="apple-mobile-web-app-title" content="KeepIt">',
             '<meta name="apple-mobile-web-app-title" content="LiveIt"><meta name="apple-mobile-web-app-capable" content="yes">'],
            ['<title>KeepIt</title>','<title>LiveIt — Today</title>']
          ];
          let expectedConnected=root.replace(a,b).replace('</head>',navigationCSS+startupJS+'</head>')
            .replace('<body>','<body><div id="connected-startup" role="status" aria-live="polite">Opening workspace…</div>')
            .replace('</body>',navigationJS+'</body>');
          for(const [oldValue,newValue] of installChanges){
            assert.equal(expectedConnected.split(oldValue).length,2,'Exact connected metadata: '+oldValue);
            expectedConnected=expectedConnected.replace(oldValue,newValue);
          }
          // Only the connected entry changes scheduling of presentation resources.
          const critical="<style id=\"connected-critical\">body{margin:0;background:#10212d}body>.library-shell{visibility:hidden}#connected-startup{display:flex;position:fixed;inset:0;align-items:center;justify-content:center;background:#10212d;color:#e7f0f2;z-index:1500;font:600 16px system-ui}html[data-connected-boot] #connected-startup{display:none}html[data-connected-starting] #connected-startup{display:flex}html[data-connected-boot]:not([data-connected-starting]) body>.library-shell{visibility:visible}</style>";
          const importHead=patched.slice(0,patched.indexOf('function '));
          const preloadImports=[...importHead.matchAll(/import(?:[^;]*?from)?"(\.\/[^"\n]+)";/g)].map(match=>'<link rel="modulepreload" href="/assets/'+match[1].slice(2)+'">').join('');
          expectedConnected=expectedConnected.replace('<head>','<head>'+critical+preloadImports)
            .replace('src="/assets/appearance-init-09598643a711.js"','defer src="/assets/appearance-init-09598643a711.js"')
            .replace('src="/partners/design/app-appearance.js?v=journal-1"','defer src="/partners/design/app-appearance.js?v=journal-1"')
            .replaceAll('<link rel="stylesheet"','<link rel="stylesheet" media="print" data-connected-style');
          if(existsSync('partners/connected/owner-release.json')){
            const owner=JSON.parse(get('partners/connected/owner-release.json'));
            assert.equal(owner.schema,'keepit.owner-live-release.v1');assert.equal(owner.target,'OneDrive / KeepIt');
            assert.equal(owner.sourceArchiveSha256,'d55d4131aa28f25d96b718389b673de71ac3190ca974621dd5e7f6eec7feb51a');
            for(const [path,hash] of Object.entries(owner.files)){assert.ok(!path.startsWith('/')&&!path.split('/').includes('..'));assert.equal(createHash('sha256').update(readFileSync(path)).digest('hex'),hash,'Pinned owner artifact: '+path);}
            for(const path of Object.keys(owner.files).filter(p=>p.startsWith('assets/')&&p.endsWith('.js'))){
              for(const match of get(path).matchAll(/["'](\.\/[^"']+\.js)["']/g)){
                const dependency='assets/'+match[1].slice(2);
                assert.ok(existsSync(dependency),'Compiled dependency missing from clean checkout: '+dependency);
                assert.ok(owner.files[dependency],'Compiled dependency missing from owner proof: '+dependency);
              }
            }
            assert.ok(connected.includes(owner.entry));assert.ok(!connected.includes('library-app-connected-w18e.js'));
          }else assert.equal(connected,expectedConnected,'KeepIt base must remain byte-identical except approved LiveIt shell metadata');
          const manifest=JSON.parse(get('partners/connected/liveit.webmanifest'));
          assert.equal(manifest.id,'/partners/connected/?connected-app=liveit');
          assert.equal(manifest.start_url,'/partners/connected/?connected-app=liveit');
          assert.equal(manifest.scope,'/partners/connected/');
          assert.equal(manifest.name,'LiveIt');
          assert.equal(manifest.short_name,'LiveIt');
          assert.equal(manifest.display,'standalone');
          assert.ok(manifest.icons.some(icon=>icon.src.includes('connected-w18e-c15396/assets/icon-192.png')));
          const keepItManifest=JSON.parse(get('manifest.webmanifest'));
          assert.equal(keepItManifest.name,existsSync('ops/ui/owner-entry.html')?'LiveIt':'KeepIt');
          assert.equal(keepItManifest.id,'/');
          if(existsSync('ops/ui/owner-entry.html')){assert.equal(actualRoot,get('ops/ui/owner-entry.html'));assert.ok(!actualRoot.includes('library-app-'));assert.ok(actualRoot.includes('/assets/owner-entry-v2.js'));assert.equal(keepItManifest.start_url,'/partners/connected/?connected-app=liveit');assert.equal(get('sw.js'),get('ops/ui/owner-shell-worker.js'));}
          // This extension survives the guarded Pages publisher regenerating
          // root index.html; it canonicalizes old /?connected-app= links.
          const legacy=get('keepit-responsive-qa.js');
          assert.equal(legacy,get('ops/ui/keepit-responsive-qa.js'),
            'Pages-publisher canonical app navigation must match stable ops source');
          assert.ok(root.includes('/keepit-responsive-qa.js?v=20261103b'));
          assert.ok(legacy.includes("location.pathname==='/'"));
          assert.ok(legacy.includes("destination=new URL('/partners/connected/',location.origin)"));
          assert.ok(legacy.includes('location.replace(destination.pathname+destination.search+destination.hash)'));
          assert.ok(legacy.includes("connected.searchParams.set('connected-app',label.toLowerCase())"));
          const connectedNav=get('partners/connected/connected-nav.js');
          for(const url of ['liveit','keepit','thinkit','travelit'])
            assert.ok(connectedNav.includes("id:'"+url+"'"));
          assert.ok(connectedNav.includes("location.replace('/partners/connected/?connected-app=liveit')"));
          assert.ok(connectedNav.includes("target.searchParams.set('connected-app',mode.id)"));
          assert.ok(connectedNav.includes("summary.textContent='KeepIt notes'"));
          assert.ok(connectedNav.includes("toolsButton.id='connected-note-tools-toggle'"));
          assert.ok(connectedNav.includes("oldReturn?.remove()"));
          const navigationStyle=get('partners/connected/connected-nav.css');
          assert.ok(navigationStyle.includes('#connected-apps-nav'));
          assert.ok(navigationStyle.includes('section[aria-label="LiveIt connected workspace"] > .connected-note-tools'));
          assert.ok(navigationStyle.includes('visibility:hidden'));
          assert.ok(navigationStyle.includes('#connected-apps-list button:is(#connected-note-tools-toggle,#connected-onedrive-toggle)'));
          const connectedWorkspaceChanges=[
            ['h.title="TravelIt trip planning workspace",h.src=',
             'h.title="TravelIt trip planning workspace",h.allowFullscreen=!0,h.src='],
            [from,to],
            ['h.src="/partners/travelit/thinkit/afda98f5ced9406d0fe5/index.html"',
             'h.src="/partners/travelit/thinkit/afda98f5ced9406d0fe5/index.html?v=workspace-4"'],
            ['d.src="/thinkit/36f8901ec722db162bcf/index.html"',
             'd.src="/thinkit/36f8901ec722db162bcf/index.html?v=topic-order-1"'],
            ['function Io(){if(!(!Ve||go||!de||!f||f.readOnly)){',
             'function getWritableConnectedLibrary(){return de&&f&&!f.readOnly?f:null}function Io(){if(Ve&&!go){'],
            [',Ve.id==="liveit"){Y=Li({workspace:V,getLibrary:()=>f,',
             ',Ve.id==="liveit"){Y=Li({workspace:V,getLibrary:getWritableConnectedLibrary,'],
            ['if(Ve.id==="travelit"){Y=Ni({workspace:V,getLibrary:()=>f,',
             'if(Ve.id==="travelit"){Y=Ni({workspace:V,getLibrary:getWritableConnectedLibrary,'],
            ['async function c(){return(!g||!await g.verifyHost(g.host))&&(g=await at({consumer:"liveit",',
             'async function c(){if(!t())throw Error("Connect a writable KeepIt library before opening a native note.");return(!g||!await g.verifyHost(g.host))&&(g=await at({consumer:"liveit",'],
            ['async function E(){return(!g||!await g.verifyHost(g.host))&&(g=await at({consumer:"travelit",',
             'async function E(){if(!t())throw Error("Connect a writable KeepIt library before opening a native note.");return(!g||!await g.verifyHost(g.host))&&(g=await at({consumer:"travelit",'],
            ['if(Gt.click(),Y){Y.root.dataset.connectedApp=Ve.id;',
             'if(toggleThinkItWorkspace(),Y){Y.root.dataset.connectedApp=Ve.id;'],
            ['Gt&&Gt.addEventListener("click",()=>{if(Y){Y.dispose(),Y=null;return}Y=Pi({getLibrary:()=>f,',
             'Gt?.addEventListener("click",toggleThinkItWorkspace);function toggleThinkItWorkspace(){if(Y){Y.dispose(),Y=null;return}Y=Pi({getLibrary:getWritableConnectedLibrary,'],
            [':void 0})});async function je()', ':void 0})}async function je()'],
            ['Y?.notifyReady()', 'Y?.notifyReady?.()'],
            ['Jo().then(Io)', 'Io();Jo().then(Io)']
          ];
          let expectedBundle=native;
          for(const [before,after] of connectedWorkspaceChanges){
            assert.equal(expectedBundle.split(before).length,2,'Expected one pinned bundle change: '+before);
            expectedBundle=expectedBundle.replace(before,after);
          }
          assert.equal(patched,expectedBundle,'Connected bundle must match the original outside the permitted workspace changes');
          const calendar=existsSync('partners/connected/liveit-calendar-release.json')?JSON.parse(get('partners/connected/liveit-calendar-release.json')):null;
          if(calendar){assert.equal(calendar.schema,'liveit.calendar-release.v1');for(const [p,h] of Object.entries(calendar.files))assert.equal(createHash('sha256').update(readFileSync(p)).digest('hex'),h,'LiveIt calendar release: '+p);}
          const oldLiveIt=get('partners/liveit/thinkit/c15396ee7cd1cba9b5e5/app-8.js');
          const connectedLiveIt=get('partners/liveit/thinkit/connected-w18e-c15396/app-8.js');
          let expected=oldLiveIt;
          for(const [a,b] of [
            ["url:'https://kdg-007.github.io/'","url:'/partners/connected/?connected-app=keepit'"],
            ["url:'https://kdg-it.github.io/thinkit/'","url:'/partners/connected/?connected-app=thinkit'"],
            ["url:'https://kdg-it.github.io/'","url:'/partners/connected/?connected-app=travelit'"],
            ["document.addEventListener('click',ev=>{", "document.addEventListener('click',ev=>{\n    if(ev.target.closest('#liveit-app-switcher a'))return;"]
          ]) {
            assert.equal(expected.split(a).length,2,'Expected a single pinned app link '+a);
            expected=expected.replace(a,b);
          }
          if(!calendar)assert.equal(connectedLiveIt,expected,'Connected LiveIt changes are limited to app routes and allowing their native link clicks');
          const originalDir='partners/liveit/thinkit/c15396ee7cd1cba9b5e5';
          const connectedDir='partners/liveit/thinkit/connected-w18e-c15396';
          {
            for(const file of ['index.html','app-0.js','app-1.js','app-2.js','app-3.js','app-4.js','app-5.js','app-6.js','app-7.js','app-9.js',
                                'owned-liveit-hooks.js','keepit-note-client.mjs','style-0.css','style-1.css','style-2.css']){
              if(calendar?.files[connectedDir+'/'+file])continue;
              assert.equal(get(connectedDir+'/'+file),get(originalDir+'/'+file),'Unexpected connected variant change: '+file);
            }
          }
          for(const id of ['liveit','travelit','thinkit'])assert.ok(patched.includes(id));
          const status=JSON.parse(get('partners/connected/status.json'));
          assert.equal(status.oneDriveReadbackVerified,false);
          assert.equal(status.interAppOriginalDataMigration,'none');
          console.log('KEEPIT_CONNECTED_PINNED_WRITER_UNCHANGED_PASS');
          JS
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runtime in disposable runner
        id: browser_runtime
        shell: bash
        timeout-minutes: 4
        run: |
          printf '{"type":"module","private":true}\n' > package.json
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1 esbuild@0.28.2
          npx playwright install --with-deps chromium webkit
      - name: Verify app-file trash, restore and automatic ThinkIt saving
        run: node partners/connected/app-file-lifecycle.browser.mjs
      - name: Verify calendar, contrast, measured rulers and TravelIt refinements
        run: node partners/design/suite-refinements.browser.mjs
      - name: Verify dependency constraints and bounded map downloads
        run: node partners/travelit/thinkit/afda98f5ced9406d0fe5/tests/refinements.test.mjs
      - name: Verify ThinkIt Business Model Canvas in Chromium and WebKit
        run: node partners/design/thinkit-business-model.browser.mjs
      - name: Verify committed TravelIt startup bundle matches source
        shell: bash
        run: |
          cp partners/travelit/thinkit/afda98f5ced9406d0fe5/js/app-fast.js /tmp/travelit-committed.js
          npx esbuild partners/travelit/thinkit/afda98f5ced9406d0fe5/js/app.js --bundle --format=esm --platform=browser --target=es2020 --minify '--external:./excel-preview.js*' --outfile=partners/travelit/thinkit/afda98f5ced9406d0fe5/js/app-fast.js
          cmp /tmp/travelit-committed.js partners/travelit/thinkit/afda98f5ced9406d0fe5/js/app-fast.js
      - name: Verify bounded read-only Excel reader and planner
        run: node partners/travelit/thinkit/afda98f5ced9406d0fe5/tests/excel-preview.test.mjs
      - name: Verify Excel batch metadata and backup compatibility
        run: node partners/travelit/thinkit/afda98f5ced9406d0fe5/tests/excel-import.test.mjs
      - name: Verify combined packing templates
        run: node partners/travelit/thinkit/afda98f5ced9406d0fe5/tests/workspace-v3.test.mjs
      - name: Verify multi-day calendar contract
        run: node partners/connected/liveit-calendar.unit.mjs
      - name: Verify app folders, immutable revisions and conflict readback
        run: node partners/connected/app-repository-store.test.mjs
      - name: Verify event save and reload across independent devices
        run: node partners/connected/liveit-calendar.browser.mjs
      - name: Verify Microsoft callback and nonblocking OneDrive reconnect
        run: node partners/connected/owner-connection.test.mjs
      - name: Verify single-tab draft saves and copy recovery
        run: node partners/connected/keepit-single-tab-draft.browser.mjs
      - name: Exercise canonical KeepIt native-note create, save and reopen
        shell: bash
        timeout-minutes: 9
        env:
          CI: "true"
        run: node partners/connected/first-party-native-notes.test.mjs
      - name: Verify shared navigation across devices in Chromium and WebKit
        if: ${{ success() && steps.browser_runtime.outcome == 'success' }}
        shell: bash
        timeout-minutes: 6
        run: node partners/design/app-ui-v1.test.mjs
      - name: Save interface previews
        if: ${{ !cancelled() && steps.browser_runtime.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: appearance-previews
          path: appearance-qa/*
          if-no-files-found: ignore
