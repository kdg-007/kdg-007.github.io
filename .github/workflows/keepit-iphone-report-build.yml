name: KeepIt iPhone diagnostic report branch build
on:
  push:
    branches: [feat/keepit-iphone-copy-connection-report-20261123]
    paths:
      - ops/ui/live-modules/onedrive-connection.js
      - partners/connected/owner-connection.test.mjs
      - ops/ui/build-live-stability.mjs
      - .github/workflows/keepit-iphone-report-build.yml
permissions:
  contents: write
concurrency:
  group: keepit-iphone-report-build
  cancel-in-progress: false
jobs:
  compile:
    if: github.ref == 'refs/heads/feat/keepit-iphone-copy-connection-report-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned compiler
        run: |
          printf '{"type":"module","private":true}\n' > package.json
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund esbuild@0.28.2
      - name: Verify OneDrive source regression
        run: |
          node --check ops/ui/live-modules/onedrive-connection.js
          node --test partners/connected/onedrive-recovery.test.mjs partners/connected/catalog-read.test.mjs
      - name: Build content-addressed KeepIt modules
        run: node ops/ui/build-live-stability.mjs
      - name: Check transfer hosts and CSP
        run: node ops/ui/transfer-host-policy.test.mjs
      - name: Verify deterministic second build
        run: |
          node ops/ui/build-live-stability.mjs
          git diff --check
          test -f partners/connected/owner-release.json
      - name: Commit compiled assets only to draft branch
        run: |
          set -euo pipefail
          git add assets/keepit-auth-live-*.js assets/keepit-onedrive-connect-*.js assets/keepit-transfer-hosts-*.js assets/keepit-graph-provider-*.js assets/keepit-note-ui-*.js assets/keepit-note-link-*.js assets/library-app-*.js partners/connected/index.html partners/connected/owner-release.json ops/ui/LIVE_STABILITY_MODULES.json partners/connected/liveit-calendar-release.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Compile iPhone connection report copy release candidate'
            git push origin HEAD:refs/heads/feat/keepit-iphone-copy-connection-report-20261123
          fi
