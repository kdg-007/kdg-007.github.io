name: Diagnose KeepIt Pages live content
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-keepit-pages.yml']
permissions:
  contents: read
  pages: read
jobs:
  verify-live-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect GitHub Pages configuration and live origin
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,hashlib
          repo=os.environ['GITHUB_REPOSITORY']
          api='https://api.github.com/repos/'+repo+'/pages'
          token=os.environ['GH_TOKEN']
          req=urllib.request.Request(api,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','User-Agent':'KeepIt-Device-QA-Diagnostics'})
          try:
            with urllib.request.urlopen(req,timeout=20) as r:
              o=json.load(r)
              print('PAGES_CONFIG',json.dumps({k:o.get(k) for k in ('url','html_url','status','build_type','source','public','https_enforced')},sort_keys=True))
          except Exception as e: print('PAGES_CONFIG_ERROR',str(e)[:300])
          paths=['/','/index.html','/build-info.json','/auth/callback/','/?utm_source=chatgpt.com','/assets/library-app-CD77QIE2.js','/sw.js','/keepit-responsive-qa.css?v=20261103b','/keepit-responsive-qa.js?v=20261103b']
          for path in paths:
            u='https://kdg-007.github.io'+path
            req=urllib.request.Request(u,headers={'User-Agent':'KeepIt-Device-QA-Diagnostics','Cache-Control':'no-cache'})
            try:
              with urllib.request.urlopen(req,timeout=25) as r:
                body=r.read(120000)
                txt=body.decode('utf8','replace')
                print('LIVE_RESULT',json.dumps({'path':path,'status':r.status,'content_type':r.headers.get('Content-Type'),'length':len(body),'sha256_first120k':hashlib.sha256(body).hexdigest(),'hasKeepItApp':'library-app-' in txt,'hasOldReadme':'KeepIt — device QA hosting' in txt,'mobileStylesheetLinked':'/keepit-responsive-qa.css' in txt,'mobileScriptLinked':'/keepit-responsive-qa.js' in txt,'mobileNavLogic':'keepit-app-launchers' in txt,'start':txt[:220]},sort_keys=True))
            except urllib.error.HTTPError as e:print('LIVE_HTTP_ERROR',path,e.code)
            except Exception as e:print('LIVE_ERROR',path,str(e)[:250])
          def fetch(path):
            req=urllib.request.Request('https://kdg-007.github.io'+path,headers={'User-Agent':'KeepIt-Device-QA-LiveRelease-Check','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=25) as r:
              if r.status!=200:raise SystemExit('Live QA release asset failed: '+path)
              return r.read()
          build=json.loads(fetch('/build-info.json'))
          if build.get('buildId')!='0ba8c8cdbf11' or build.get('protectedOneDriveFolder')!='KeepIt-TK02-QA-2026-10-30':
            raise SystemExit('LIVE_RELEASE_MISMATCH: old build-info or unsafe QA folder')
          sw=fetch('/sw.js').decode('utf8','replace')
          if '0ba8c8cdbf11' not in sw: raise SystemExit('LIVE_RELEASE_MISMATCH: old service worker')
          index=fetch('/index.html').decode('utf8','replace')
          if 'keepit-qa-picker-guard' in index:
            raise SystemExit('LIVE_RELEASE_MISMATCH: redundant picker overlay still active')
          if 'keepit-responsive-qa' not in index or 'library-app-JCDBALIT.js' not in index:
            raise SystemExit('LIVE_RELEASE_MISMATCH: old homepage')
          chunk=fetch('/assets/chunk-JFWFVGPS.js').decode('utf8','replace')
          if 'Only this verified QA folder' not in chunk or 'qaPickerVerified' not in chunk:
            raise SystemExit('LIVE_RELEASE_MISMATCH: QA folder picker correction not served')
          print('LIVE_QA_RELEASE_PASS',build['buildId'],'QA picker, homepage, service worker and folder restriction all current')
          PY
