name: Verify live KeepIt device-QA release identity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-keepit-pages.yml', 'delivery/manifest.json']

permissions:
  contents: read
  pages: read

jobs:
  verify-live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed release against signed-off private compile transfer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, re, time, urllib.request, urllib.error

          manifest=json.loads(pathlib.Path('delivery/manifest.json').read_text())
          expected=manifest.get('compiledBuildId','')
          digest=manifest.get('sha256','')
          if (manifest.get('schema')!='keepit.github-qa-text-transfer.v1' or
              manifest.get('target')!='github-pages-qa' or
              manifest.get('oneDriveFolder')!='KeepIt-TK02-QA-2026-10-30' or
              not re.fullmatch('[a-f0-9]{12}',expected) or
              not re.fullmatch('[a-f0-9]{64}',digest)):
              raise SystemExit('Invalid QA attestation in public transfer')

          def fetch(path):
              url='https://kdg-007.github.io'+path
              request=urllib.request.Request(url,headers={
                  'User-Agent':'KeepIt-Device-QA-Release-Verification',
                  'Cache-Control':'no-cache','Pragma':'no-cache'
              })
              with urllib.request.urlopen(request,timeout=25) as response:
                  if response.status!=200:
                      raise RuntimeError(f'Live site returned {response.status}: {path}')
                  return response.read()

          # GitHub Pages may finish updating after the Pages workflow reports
          # success. Permit bounded CDN propagation, but never claim a stale site.
          for attempt in range(8):
              try:
                  live=json.loads(fetch('/build-info.json'))
                  if (live.get('buildId')==expected and
                      live.get('deliveryTarget')=='github-pages-qa' and
                      live.get('protectedOneDriveFolder')=='KeepIt-TK02-QA-2026-10-30'):
                      break
              except Exception as error:
                  print('Live metadata read pending:',str(error)[:250])
              print('Awaiting matching QA deployment',attempt+1,'expected',expected)
              if attempt<7:time.sleep(8)
          else:
              raise SystemExit('LIVE_RELEASE_MISMATCH: Pages still serves another build')

          sw=fetch('/sw.js').decode('utf-8','replace')
          if expected not in sw:
              raise SystemExit('LIVE_RELEASE_MISMATCH: service worker does not match compiled build')
          index=fetch('/index.html').decode('utf-8','replace')
          if ('Content-Security-Policy' not in index or
              'keepit-responsive-qa' not in index or
              'keepit-qa-picker-guard' in index):
              raise SystemExit('LIVE_RELEASE_MISMATCH: missing security policy or wrong QA page')
          app_match=re.search(r'assets/library-app-[A-Za-z0-9_-]+\.js',index)
          if not app_match:
              raise SystemExit('LIVE_RELEASE_MISMATCH: no compiled app entrypoint')
          asset='/'+app_match.group(0)
          js=fetch(asset).decode('utf-8','replace')
          for required in ('Inspect OneDrive copy','Recover using fresh filename','retargetZeroByte'):
              if required not in js:
                  raise SystemExit('LIVE_RELEASE_MISMATCH: missing protected recovery feature '+required)
          callback=fetch('/auth/callback/')
          if not callback or b'html' not in callback[:500].lower():
              raise SystemExit('LIVE_RELEASE_MISMATCH: auth callback not hosted')

          print('LIVE_QA_RELEASE_PASS',json.dumps({
              'compiledBuildId':expected,
              'compiledTransferSha256':digest,
              'verifiedPublicAsset':asset,
              'serviceWorkerMatch':True,
              'protectedOneDriveFolder':live['protectedOneDriveFolder'],
              'liveAppSha256':hashlib.sha256(js.encode()).hexdigest()
          },sort_keys=True))
          PY
