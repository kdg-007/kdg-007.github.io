name: TravelIt mobile density source and release proof
on:
  push:
    branches: [fix/travelit-mobile-itinerary-density-20261117]
    paths:
      - partners/travelit/thinkit/afda98f5ced9406d0fe5/js/app.js
      - partners/travelit/thinkit/afda98f5ced9406d0fe5/css/workspace.css
      - partners/travelit/thinkit/afda98f5ced9406d0fe5/index.html
      - partners/travelit/thinkit/afda98f5ced9406d0fe5/tests/workspace-v3.browser.mjs
      - partners/design/app-ui-v1.test.mjs
      - .github/workflows/travelit-mobile-branch-build.yml
permissions:
  contents: write
concurrency:
  group: travelit-mobile-density-build-20261117
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/fix/travelit-mobile-itinerary-density-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned compiler in disposable workspace
        run: |
          printf '{"type":"module","private":true}\n' > package.json
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund esbuild@0.28.2
      - name: Validate source and browser acceptance scripts
        run: |
          node --check partners/travelit/thinkit/afda98f5ced9406d0fe5/js/app.js
          node --check partners/travelit/thinkit/afda98f5ced9406d0fe5/tests/workspace-v3.browser.mjs
          node --check partners/design/app-ui-v1.test.mjs
      - name: Regenerate TravelIt startup bundle and signed owner-manifest file hashes
        run: |
          npx --no-install esbuild partners/travelit/thinkit/afda98f5ced9406d0fe5/js/app.js --bundle --format=esm --platform=browser --target=es2020 --minify '--external:./excel-preview.js*' --outfile=partners/travelit/thinkit/afda98f5ced9406d0fe5/js/app-fast.js
          node ops/ui/build-live-stability.mjs
          node ops/ui/transfer-host-policy.test.mjs
      - name: Rebuild must be byte-for-byte stable
        run: |
          cp partners/travelit/thinkit/afda98f5ced9406d0fe5/js/app-fast.js /tmp/mobile-m1-bundle.js
          cp partners/connected/owner-release.json /tmp/mobile-m1-release.json
          npx --no-install esbuild partners/travelit/thinkit/afda98f5ced9406d0fe5/js/app.js --bundle --format=esm --platform=browser --target=es2020 --minify '--external:./excel-preview.js*' --outfile=partners/travelit/thinkit/afda98f5ced9406d0fe5/js/app-fast.js
          node ops/ui/build-live-stability.mjs
          cmp /tmp/mobile-m1-bundle.js partners/travelit/thinkit/afda98f5ced9406d0fe5/js/app-fast.js
          cmp /tmp/mobile-m1-release.json partners/connected/owner-release.json
          git diff --check
      - name: Commit only regenerated release proof and startup bundle to feature branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/travelit-mobile-itinerary-density-20261117'
          git add partners/travelit/thinkit/afda98f5ced9406d0fe5/js/app-fast.js partners/connected/owner-release.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Compile TravelIt compact iPhone workspace and refresh owner proof'
            git push origin HEAD:refs/heads/fix/travelit-mobile-itinerary-density-20261117
          fi
