name: KeepIt P0 branch-only compiled asset verification
on:
  push:
    branches: [fix/keepit-transport-error-classification-20261114]
    paths:
      - ops/ui/live-modules/onedrive-connection.js
      - ops/ui/build-live-stability.mjs
      - partners/connected/onedrive-recovery.test.mjs
      - .github/workflows/keepit-p0-branch-build.yml
permissions:
  contents: write
concurrency:
  group: keepit-p0-branch-compiled-artifacts
  cancel-in-progress: false
jobs:
  compile:
    if: github.ref == 'refs/heads/fix/keepit-transport-error-classification-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned release compiler
        run: |
          printf '{"type":"module","private":true}\n' > package.json
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund esbuild@0.28.2
      - name: Check transport regression without real user access
        run: node --test partners/connected/onedrive-recovery.test.mjs
      - name: Build content-addressed assets and signed-off release manifest
        run: node ops/ui/build-live-stability.mjs
      - name: Confirm that a second build is byte-identical
        run: |
          node ops/ui/build-live-stability.mjs
          test -f partners/connected/owner-release.json
          git diff --check
      - name: Commit only compiled owner source artifacts to draft branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/keepit-transport-error-classification-20261114'
          git add assets/keepit-auth-live-*.js assets/keepit-onedrive-connect-*.js assets/keepit-note-ui-*.js assets/keepit-note-link-*.js assets/library-app-*.js partners/connected/index.html partners/connected/owner-release.json ops/ui/LIVE_STABILITY_MODULES.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Compile P0 OneDrive transport diagnostics for browser verification'
            git push origin HEAD:refs/heads/fix/keepit-transport-error-classification-20261114
          fi
