name: KeepIt guarded device-QA website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'build-info.json', 'auth/**', 'assets/**', 'sw.js', 'manifest.webmanifest', 'delivery/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: keepit-qa-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore validated compiled site from private build transfer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          if [[ -f delivery/manifest.json ]]; then
            python3 - <<'PY'
          import json,base64,hashlib,zipfile,pathlib,io,stat
          root=pathlib.Path('delivery')
          m=json.loads((root/'manifest.json').read_text())
          if m.get('schema')!='keepit.github-qa-text-transfer.v1' or m.get('target')!='github-pages-qa' or m.get('oneDriveFolder')!='KeepIt-TK02-QA-2026-10-30':
              raise SystemExit('Rejected incompatible transfer manifest')
          count=m['parts']
          if not isinstance(count,int) or not (1<=count<=100):raise SystemExit('Invalid part count')
          encoded=''.join((root/f'part{i:03d}.txt').read_text() for i in range(count))
          if len(encoded)!=m['base64Chars'] or len(encoded)>45_000_000:raise SystemExit('Unexpected transfer length')
          data=base64.b64decode(encoded,validate=True)
          if len(data)!=m['bytes'] or hashlib.sha256(data).hexdigest()!=m['sha256']:raise SystemExit('Compiled transfer digest mismatch')
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              items=z.infolist()
              if not (10<len(items)<2500):raise SystemExit('Invalid site file count')
              if sum(x.file_size for x in items)>100_000_000:raise SystemExit('Unexpected inflated site size')
              for item in items:
                  n=item.filename
                  parts=pathlib.PurePosixPath(n).parts
                  if not n or n.startswith('/') or '..' in parts or '\\' in n or stat.S_ISLNK(item.external_attr>>16):
                      raise SystemExit('Unsafe archive entry: '+n)
              z.extractall('_site')
          print('Verified compiled-only transfer restored:',m['sha256'])
          PY
          else
            rsync -a --exclude='.git/' --exclude='.github/' --exclude='README.md' --exclude='ops/' --exclude='delivery/' --exclude='_site/' ./ _site/
          fi
      - name: Reject source, secrets, and non-QA builds
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='_site';
          const required=['index.html','auth/callback/index.html','sw.js','manifest.webmanifest','.nojekyll','build-info.json'];
          for(const f of required) if(!fs.existsSync(path.join(root,f)))throw Error('Missing compiled site file: '+f);
          const info=JSON.parse(fs.readFileSync(path.join(root,'build-info.json'),'utf8'));
          if(info.deliveryTarget!=='github-pages-qa')throw Error('Refusing non-QA build');
          if(info.protectedOneDriveFolder!=='KeepIt-TK02-QA-2026-10-30')throw Error('Refusing build without disposable OneDrive folder policy');
          const allowed=new Set(['assets','auth','vendor','fixtures','thinkit','partners','engineering']);
          const blockedExtensions=/\.(?:pem|pfx|p12|key|cer|sqlite|db|zip|tar|gz|log|map)$/i;
          const walk=(dir='')=>{
            for(const item of fs.readdirSync(path.join(root,dir),{withFileTypes:true})){
              const rel=path.join(dir,item.name);
              if(blockedExtensions.test(item.name))throw Error('Forbidden published file: '+rel);
              if(item.isDirectory()){
                if(!dir&&!allowed.has(item.name))throw Error('Unexpected top-level folder: '+item.name);
                walk(rel);
              }else if(item.name.startsWith('.')&&item.name!=='.nojekyll')throw Error('Unexpected hidden file: '+rel);
            }
          };
          walk();
          const page=fs.readFileSync(path.join(root,'index.html'),'utf8');
          if(!page.includes('Content-Security-Policy'))throw Error('HTML security policy missing');
          if(!fs.readdirSync(path.join(root,'assets')).some(f=>/library-app-.*\.js$/.test(f)))throw Error('Compiled app missing');
          console.log('Passed static QA bundle policy, build ID: '+info.buildId);
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
