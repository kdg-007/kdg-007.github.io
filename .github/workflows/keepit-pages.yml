name: KeepIt guarded device-QA website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'build-info.json', 'auth/**', 'assets/**', 'sw.js', 'manifest.webmanifest', 'delivery/**', 'ops/ui/**', '.github/workflows/keepit-pages.yml']

permissions:
  contents: write

concurrency:
  group: keepit-qa-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore validated compiled site from private build transfer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          if [[ -f delivery/manifest.json ]]; then
            python3 - <<'PY'
          import json,base64,hashlib,zipfile,pathlib,io,stat
          root=pathlib.Path('delivery')
          m=json.loads((root/'manifest.json').read_text())
          if m.get('schema')!='keepit.github-qa-text-transfer.v1' or m.get('target')!='github-pages-qa' or m.get('oneDriveFolder')!='KeepIt-TK02-QA-2026-10-30':
              raise SystemExit('Rejected incompatible transfer manifest')
          count=m['parts']
          if not isinstance(count,int) or not (1<=count<=100):raise SystemExit('Invalid part count')
          encoded=''.join((root/f'part{i:03d}.txt').read_text() for i in range(count))
          if len(encoded)!=m['base64Chars'] or len(encoded)>45_000_000:raise SystemExit('Unexpected transfer length')
          data=base64.b64decode(encoded,validate=True)
          if len(data)!=m['bytes'] or hashlib.sha256(data).hexdigest()!=m['sha256']:raise SystemExit('Compiled transfer digest mismatch')
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              items=z.infolist()
              if not (10<len(items)<2500):raise SystemExit('Invalid site file count')
              if sum(x.file_size for x in items)>100_000_000:raise SystemExit('Unexpected inflated site size')
              for item in items:
                  n=item.filename
                  parts=pathlib.PurePosixPath(n).parts
                  if not n or n.startswith('/') or '..' in parts or '\\' in n or stat.S_ISLNK(item.external_attr>>16):
                      raise SystemExit('Unsafe archive entry: '+n)
              z.extractall('_site')
          print('Verified compiled-only transfer restored:',m['sha256'])
          PY
          else
            rsync -a --exclude='.git/' --exclude='.github/' --exclude='README.md' --exclude='ops/' --exclude='delivery/' --exclude='_site/' ./ _site/
          fi
      - name: Apply responsive QA navigation to compiled site
        shell: bash
        run: |
          set -euo pipefail
          test -f ops/ui/keepit-responsive-qa.css
          test -f ops/ui/keepit-responsive-qa.js
          cp ops/ui/keepit-responsive-qa.css _site/keepit-responsive-qa.css
          cp ops/ui/keepit-responsive-qa.js _site/keepit-responsive-qa.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path('_site/index.html')
          s=html.read_text()
          css='<link rel="stylesheet" href="/keepit-responsive-qa.css?v=20261103b">'
          js='<script src="/keepit-responsive-qa.js?v=20261103b" defer></script>'
          if s.count('</head>')!=1 or s.count('</body>')!=1:raise SystemExit('Unexpected KeepIt HTML: QA overlay refused')
          if 'keepit-responsive-qa.css' in s or 'keepit-responsive-qa.js' in s:raise SystemExit('Refusing duplicate QA overlay')
          html.write_text(s.replace('</head>',css+'</head>').replace('</body>',js+'</body>'))
          print('Mobile QA interface overlay applied to exactly one compiled homepage')
          PY
      - name: Preserve shared first-party interface styling in generated previews
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          pages=[
              ('thinkit/index.html','thinkit'),
              ('thinkit/36f8901ec722db162bcf/index.html','thinkit'),
              ('partners/travelit/thinkit/afda98f5ced9406d0fe5/index.html','travelit'),
          ]
          css='<link rel="stylesheet" href="/partners/design/app-family-v1.css">'
          for rel,app in pages:
              file=Path('_site')/rel
              if not file.is_file():
                  # Pinned snapshots can already exist on Pages outside the
                  # latest transfer archive; preserve them without failing.
                  if rel=='thinkit/36f8901ec722db162bcf/index.html':
                      continue
                  raise SystemExit('Missing first-party app preview: '+rel)
              html=file.read_text()
              original='<html lang="en">'
              tagged='<html lang="en" data-suite-app="'+app+'">'
              if tagged not in html:
                  if html.count(original)!=1:
                      raise SystemExit('Unexpected HTML root in '+rel)
                  html=html.replace(original,tagged,1)
              if css not in html:
                  if html.count('</head>')!=1:
                      raise SystemExit('Unexpected HTML head in '+rel)
                  html=html.replace('</head>',css+'</head>',1)
              file.write_text(html)
          print('Shared LiveIt-compatible interface tokens pinned to all generated previews')
          PY
      - name: Reject source, secrets, and non-QA builds
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='_site';
          const required=['index.html','auth/callback/index.html','sw.js','manifest.webmanifest','.nojekyll','build-info.json'];
          for(const f of required) if(!fs.existsSync(path.join(root,f)))throw Error('Missing compiled site file: '+f);
          const info=JSON.parse(fs.readFileSync(path.join(root,'build-info.json'),'utf8'));
          if(info.deliveryTarget!=='github-pages-qa')throw Error('Refusing non-QA build');
          if(info.protectedOneDriveFolder!=='KeepIt-TK02-QA-2026-10-30')throw Error('Refusing build without disposable OneDrive folder policy');
          const allowed=new Set(['assets','auth','vendor','fixtures','thinkit','partners','engineering']);
          const blockedExtensions=/\.(?:pem|pfx|p12|key|cer|sqlite|db|zip|tar|gz|log|map)$/i;
          const walk=(dir='')=>{
            for(const item of fs.readdirSync(path.join(root,dir),{withFileTypes:true})){
              const rel=path.join(dir,item.name);
              if(blockedExtensions.test(item.name))throw Error('Forbidden published file: '+rel);
              if(item.isDirectory()){
                if(!dir&&!allowed.has(item.name))throw Error('Unexpected top-level folder: '+item.name);
                walk(rel);
              }else if(item.name.startsWith('.')&&item.name!=='.nojekyll')throw Error('Unexpected hidden file: '+rel);
            }
          };
          walk();
          const page=fs.readFileSync(path.join(root,'index.html'),'utf8');
          if(!page.includes('Content-Security-Policy'))throw Error('HTML security policy missing');
          if(!fs.readdirSync(path.join(root,'assets')).some(f=>/library-app-.*\.js$/.test(f)))throw Error('Compiled app missing');
          console.log('Passed static QA bundle policy, build ID: '+info.buildId);
          NODE
      - name: Publish verified app to the one configured Pages source (main branch)
        shell: bash
        run: |
          set -euo pipefail
          # This repository currently serves Pages from its main branch, which
          # otherwise displays README.md instead of the compiled application.
          # Only _site, which passed the security gate above, is copied.
          # Verify content, not just timestamp and byte length (service workers may match in size).
          rsync -a --checksum _site/ ./
          # Native QA picker is already fail-closed; remove obsolete UI overlay.
          rm -f keepit-qa-picker-guard.js keepit-qa-picker-guard.css
          # Remove the accidental doubled output tree from the previous publisher.
          git rm -r --cached --ignore-unmatch _site >/dev/null || true
          rm -rf _site
          git config user.name "KeepIt QA publisher"
          git config user.email "actions@users.noreply.github.com"
          git add --all
          if git ls-files | grep -q '^_site/'; then echo 'ERROR: build staging folder would be published'; exit 1; fi
          if git diff --cached --quiet; then
            echo "Compiled KeepIt already matches the Pages branch."
            exit 0
          fi
          git commit -m "Publish compiled KeepIt QA website to branch-backed Pages"
          git push origin HEAD:main
