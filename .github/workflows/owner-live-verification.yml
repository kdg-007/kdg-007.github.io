name: Verify published owner collection
on:
  workflow_run:
    workflows: ["KeepIt guarded device-QA website"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: owner-live-verification
  cancel-in-progress: true
jobs:
  live:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install disposable Chromium and WebKit runtimes
        run: |
          printf '{"type":"module","private":true}\n' > package.json
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Verify deployed bytes and Microsoft return with synthetic services
        run: node partners/connected/owner-deployed.test.mjs
      - name: Verify readable toolbar labels and menu dismissal across screen sizes
        env:
          STABILITY_HEADERS_ONLY: "1"
        run: node partners/connected/save-connection-layout.browser.mjs
      - name: Verify cross-device saves, offline recovery and expired-write renewal
        run: node partners/connected/liveit-calendar.browser.mjs
