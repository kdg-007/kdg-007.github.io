<!doctype html>
<html lang="en" data-suite-app="liveit">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#142331" />
  <!-- Prepaint appearance: read only the existing visual preference; do not touch records. -->
  <script>
    (function(){
      var theme='dark';
      try{
        var saved=JSON.parse(localStorage.getItem('liveit_visual_prefs_v051')||'null');
        if(saved&&(saved.theme==='dark'||saved.theme==='light'))theme=saved.theme;
      }catch(_){}
      document.documentElement.dataset.theme=theme;
      document.documentElement.style.colorScheme=theme;
    })();
  </script>
  <title>LiveIt — Private Alpha</title>
  <meta name="description" content="LiveIt local-first Today dashboard, notes, tasks and journal. Offline private alpha; not cloud-synced.">
  <meta name="application-name" content="LiveIt">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./style-0.css">
  <link rel="stylesheet" href="./style-1.css">
  <link rel="stylesheet" href="./style-2.css">
<link rel="stylesheet" href="/partners/design/app-family-v1.css"><link rel="stylesheet" href="/partners/design/app-appearance.css?v=workspace-2"><script src="/partners/design/app-appearance.js?v=journal-1"></script></head>
<body>
  <div id="app"></div>
  <dialog id="backupPasswordDialog" aria-labelledby="backupPasswordHeading">
    <form id="backupPasswordForm" method="dialog" novalidate class="dialog-body">
      <h2 id="backupPasswordHeading">Encrypted LiveIt backup</h2>
      <p id="backupPasswordHelp" class="muted">Use a private passphrase of at least 12 characters.</p>
      <label class="field-label" for="backupPassword">Backup passphrase</label>
      <input id="backupPassword" type="password" required minlength="12" maxlength="1024" autocomplete="off" aria-describedby="backupPasswordError" style="width:100%;padding:12px">
      <div id="backupConfirmSection"><label class="field-label" for="backupPasswordConfirm">Confirm passphrase</label>
      <input id="backupPasswordConfirm" type="password" autocomplete="off" style="width:100%;padding:12px"></div>
      <label for="backupShowPassphrase" style="display:flex;align-items:center;gap:9px;font-size:13px;margin-top:12px;cursor:pointer">
        <input id="backupShowPassphrase" type="checkbox" style="width:18px;height:18px"> Show passphrase
      </label>
      <p id="backupPasswordError" role="alert" aria-live="assertive" style="min-height:1.4em;color:#ffbd96;font-weight:750"></p>
      <div class="dialog-actions"><button class="button subtle" value="cancel" type="submit" formnovalidate>Cancel</button><button class="button primary" value="confirm" type="submit">Continue</button></div>
    </form>
  </dialog>
  <input id="restoreFile" type="file" accept=".liveitbak,application/json" style="display:none" aria-label="Select encrypted LiveIt backup">
  <input id="verifyBackupFile" type="file" accept=".liveitbak,application/json" style="display:none" aria-label="Select downloaded LiveIt backup to verify">
  <dialog id="captureDialog" aria-labelledby="captureHeading" aria-modal="true"><div id="captureContent"></div></dialog>
  <dialog id="recordDialog" aria-labelledby="recordHeading" aria-modal="true"><div id="recordContent"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="./app-0.js"></script>
  <script src="./app-1.js"></script>
  <script src="./app-2.js"></script>
<script src="./app-3.js"></script>
  <script src="./app-4.js"></script>

  <script src="./app-5.js"></script>
  <script src="./app-6.js"></script>
  <script src="./app-7.js"></script>
  <script src="./app-8.js?v=journal-1"></script>
<script src="./app-9.js"></script>
<script type="module" src="./owned-liveit-hooks.js"></script></body>
</html>
